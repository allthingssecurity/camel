# Tiny test guests for camel-wasm: a WASI preview1 command module (mode=wasi)
# and an import-free function-mode module (see wasi_guest.rs and build.sh).
#
# It is a no_std crate built for wasm32-unknown-unknown that declares the
# wasi_snapshot_preview1 imports itself, so the binary stays a few KB and
# building it needs no extra Rust target. A regular std program built with
# `cargo build --target wasm32-wasip1` imports the same functions and runs the
# same way (see the component documentation).

[package]
name    = "wasi_guest"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "wasi_guest.rs"

[features]
command = []

[dependencies]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
