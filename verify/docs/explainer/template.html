<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camel verify explainer</title>
<style>
@font-face{font-family:'Inter';font-weight:500;src:url(fonts/inter-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(fonts/inter-700-normal.woff2) format('woff2')}
@font-face{font-family:'JBM';font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
:root{--bg:#f7f6f2;--ink:#1d1d1b;--soft:#8c8a84;--line:#c9c6bd;--card:#ffffff;--red:#c8402f;--amber:#b7791f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
svg{display:block;width:100%;height:auto;background:var(--bg)}
.render main{padding:0;max-width:none}
.render svg{width:1200px;height:675px}
.render .controls,.render .note{display:none}
.controls{display:flex;gap:12px;align-items:center;margin-top:10px;font:500 13px JBM,ui-monospace,monospace;color:var(--soft)}
.controls button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.controls input{flex:1}
.note{margin-top:10px;font-size:13px;color:var(--soft)}
text{font-family:Inter,system-ui,sans-serif}
.mono{font-family:JBM,ui-monospace,monospace}
</style></head>
<body>
<main>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-fps="10" data-width="1200" data-height="675">
<svg id="stage" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated explainer: an idempotent consumer loses a file on a crash, and camel verify finds it">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c8a84"/>
    </marker>
  </defs>
  <g id="layer"></g>
  <text id="act" class="mono" x="40" y="42" font-size="13" fill="#8c8a84"></text>
  <text id="jvm" class="mono" x="1160" y="42" font-size="13" text-anchor="end" fill="#8c8a84"></text>
  <text id="cap" x="600" y="96" font-size="25" font-weight="500" text-anchor="middle" fill="#1d1d1b"></text>
  <rect id="flash" x="0" y="0" width="1200" height="675" fill="#c8402f" opacity="0"/>
</svg>
</div>
<div class="controls"><button id="play" type="button">pause</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="time"><span id="clock">0.0 s</span></div>
<p class="note">The route is the jpa-idempotent-repository example of camel-quarkus-examples. The run is the TLC counterexample of models/R1_IdempotentFileHttp.tla, confirmed by tests/R1IdempotentCrashTest.</p>
</main>
<script>
(function () {
const SPEC = __SPEC__;
const DUR = __DURATION__;
const NS = 'http://www.w3.org/2000/svg';
const C = { ink: '#1d1d1b', soft: '#8c8a84', line: '#c9c6bd', card: '#ffffff', red: '#c8402f', amber: '#b7791f', bg: '#f7f6f2' };
const layer = document.getElementById('layer');

// ---- tiny keyframe engine: every attribute is a pure function of t, so any frame can be seeked ----
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
    if (t <= t1) {
      if (typeof v0 === 'string') return v0;
      const p = t1 === t0 ? 1 : ease((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) => a + (v1[j] - a) * p) : v0 + (v1 - v0) * p;
    }
  }
  return keys[keys.length - 1][1];
}
const step = (t, keys) => { let v = keys[0][1]; for (const [k, x] of keys) if (t >= k) v = x; return v; };
const tracks = [];
const on = (el, f) => tracks.push([el, f]);
const fade = (el, keys) => on(el, (e, t) => e.setAttribute('opacity', kf(t, keys).toFixed(3)));
const move = (el, keys) => on(el, (e, t) => { const [x, y] = kf(t, keys); e.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`); });

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  (parent || layer).appendChild(e);
  return e;
}
const g = (parent, attrs) => el('g', attrs || {}, parent);
const label = (p, x, y, s, size, fill, mono, weight, anchor) => el('text', {
  x, y, 'font-size': size || 14, fill: fill || C.soft, class: mono === false ? '' : 'mono',
  'font-weight': weight || 500, 'text-anchor': anchor || 'start' }, p, s);
const box = (p, x, y, w, h, stroke) => el('rect', { x, y, width: w, height: h, rx: 10, fill: 'none', stroke: stroke || C.ink, 'stroke-width': 1.3 }, p);
const arrow = (p, x1, y1, x2, y2) => el('line', { x1, y1, x2, y2, stroke: C.soft, 'stroke-width': 1.3, 'marker-end': 'url(#arr)' }, p);

// ======================= act 1: the story ===========================
const s1 = g(); fade(s1, [[0, 1], [22.3, 1], [22.9, 0]]);
const core = g(s1); fade(core, [[0, 1], [13.3, 1], [13.5, .4], [15.2, .4], [15.5, 1]]);
label(core, 70, 158, 'file:inbox'); box(core, 70, 170, 210, 230);
label(core, 70, 438, 'inbox/.camel'); box(core, 70, 450, 210, 150);
const cons = box(core, 430, 200, 260, 150);
on(cons, (e, t) => e.setAttribute('stroke', t >= 13.2 && t < 15.2 ? C.red : C.ink));
label(core, 450, 232, 'idempotentConsumer', 17, C.ink, false, 700);
label(core, 450, 256, 'key ${body}, eager=true', 13);
label(core, 470, 412, 'repository (jpa, persists each key)', 13);
el('path', { d: 'M470,440 a90,18 0 0,0 180,0 a90,18 0 0,0 -180,0 v130 a90,18 0 0,0 180,0 v-130', fill: 'none', stroke: C.ink, 'stroke-width': 1.3 }, core);
box(core, 860, 200, 270, 150);
label(core, 880, 232, 'costly api', 17, C.ink, false, 700);
label(core, 880, 256, 'http, not idempotent', 13);
label(core, 880, 300, 'calls:', 15, C.ink);
arrow(core, 290, 275, 420, 275); arrow(core, 700, 275, 850, 275);

function chip(p, x, y, s) {
  const c = g(p, { transform: `translate(${x},${y})` });
  const r = el('rect', { x: 0, y: 0, width: 48, height: 32, rx: 6, fill: C.card, stroke: C.ink, 'stroke-width': 1.2 }, c);
  label(c, 24, 21, s, 15, C.ink, true, 500, 'middle');
  return [c, r];
}
const [keyA, keyAr] = chip(core, 500, 486, 'A');
const [keyB, keyBr] = chip(core, 572, 486, 'B');
fade(keyA, [[0, 0], [4.0, 0], [4.4, 1]]);
fade(keyB, [[0, 0], [11.6, 0], [12.0, 1]]);
on(keyAr, (e, t) => e.setAttribute('stroke', t >= 8.4 && t < 9.2 ? C.amber : C.ink));
on(keyBr, (e, t) => e.setAttribute('stroke', t >= 17.4 && t < 18.4 ? C.amber : C.ink));
const pulse = el('circle', { r: 6, cx: 0, cy: 275, fill: C.ink }, core);
on(pulse, (e, t) => { e.setAttribute('cx', kf(t, [[4.6, 705], [5.1, 845]]).toFixed(1)); e.setAttribute('opacity', t > 4.6 && t < 5.15 ? 1 : 0); });
const logA = label(core, 948, 300, 'A', 15, C.ink); fade(logA, [[0, 0], [5.1, 0], [5.4, 1]]);
const miss = g(core); fade(miss, [[0, 0], [19.8, 0], [20.3, 1]]);
label(miss, 978, 300, 'B', 15, C.red);
el('line', { x1: 973, y1: 295, x2: 994, y2: 295, stroke: C.red, 'stroke-width': 1.6 }, miss);
el('circle', { cx: 984, cy: 295, r: 17, fill: 'none', stroke: C.red, 'stroke-width': 1.5 }, miss);
label(miss, 880, 334, 'B never called', 13, C.red);
const dup = label(core, 450, 340, 'duplicate, skipped', 13, C.amber);
fade(dup, [[0, 0], [8.4, 0], [8.6, 1], [9.4, 1], [9.6, 0], [17.4, 0], [17.6, 1], [18.6, 1], [18.8, 0]]);

function card(p, name, body) {
  const c = g(p);
  el('rect', { x: 0, y: 0, width: 150, height: 36, rx: 6, fill: C.card, stroke: C.ink, 'stroke-width': 1.2 }, c);
  label(c, 14, 23, name, 14, C.ink);
  label(c, 62, 23, 'body ' + body, 13);
  return c;
}
const I = [[100, 190], [100, 236], [100, 282]], A = [[100, 462], [100, 508], [100, 554]], CC = [485, 274];
move(card(core, 'f1', 'A'), [[0, I[0]], [3.2, I[0]], [3.9, CC], [6.3, CC], [7.0, A[0]]]);
move(card(core, 'f2', 'A'), [[0, I[1]], [7.7, I[1]], [8.3, CC], [9.4, CC], [10.0, A[1]]]);
move(card(core, 'f3', 'B'), [[0, I[2]], [10.7, I[2]], [11.3, CC], [13.6, CC], [14.2, I[2]], [16.0, I[2]], [16.6, CC], [19.0, CC], [19.6, A[2]]]);
const crash = label(s1, 560, 178, 'crash', 24, C.red, false, 700, 'middle');
fade(crash, [[0, 0], [13.2, 0], [13.3, 1], [15.1, 1], [15.3, 0]]);
fade(document.getElementById('flash'), [[0, 0], [13.15, 0], [13.25, .2], [13.9, 0]]);
const jvm = document.getElementById('jvm');
on(jvm, (e, t) => {
  e.textContent = t >= 22.3 ? '' : t >= 15.2 ? 'jvm: restarted' : t >= 13.2 ? 'jvm: crashed' : 'jvm: running';
  e.setAttribute('fill', t >= 13.2 && t < 15.2 ? C.red : C.soft);
});

// ======================= act 2: how verify finds it ===========================
const s2 = g(); fade(s2, [[0, 0], [22.6, 0], [23.2, 1], [37.0, 1], [37.5, 0]]);
label(s2, 220, 190, 'the run of f3, with one crash allowed', 13);
const steps = [['store key B', 220], ['call api', 510], ['move to .camel', 800]];
for (const [s, x] of steps) {
  box(s2, x, 210, 180, 56);
  label(s2, x + 90, 244, s, 16, C.ink, false, 500, 'middle');
}
arrow(s2, 405, 238, 505, 238); arrow(s2, 695, 238, 795, 238);
const P = [180, 455, 745, 1025];
const bolt = g(s2);
el('line', { x1: 0, y1: 200, x2: 0, y2: 278, stroke: C.red, 'stroke-width': 2, 'stroke-dasharray': '5 4' }, bolt);
label(bolt, 0, 194, 'crash', 13, C.red, true, 500, 'middle');
on(bolt, (e, t) => {
  const x = kf(t, [[23.4, P[0]], [24.6, P[0]], [25.0, P[1]], [26.1, P[1]], [26.5, P[2]], [27.6, P[2]], [28.0, P[3]]]);
  e.setAttribute('transform', `translate(${x.toFixed(1)},0)`);
  e.setAttribute('opacity', kf(t, [[23.2, 0], [23.4, 1], [29.0, 1], [29.3, 0]]).toFixed(3));
});
const res = [['ok', C.soft, 23.8, ''], ['B lost', C.red, 25.4, 'key stored, api never called'], ['ok', C.soft, 26.9, 'api called once'], ['ok', C.soft, 28.4, '']];
res.forEach(([s, col, t0, sub], i) => {
  const r = g(s2); fade(r, [[0, 0], [t0, 0], [t0 + .3, 1]]);
  label(r, P[i], 306, s, 17, col, false, 700, 'middle');
  if (sub) label(r, P[i], 326, sub, 12, col, true, 500, 'middle');
});
const also = label(s2, 220, 366, 'also tried: the api failing once, at each step, for every file order', 13);
fade(also, [[0, 0], [28.6, 0], [29.0, 1]]);

// state graph: layers of states, one red path to the bad state
const fan = g(s2); fade(fan, [[0, 0], [29.4, 0], [29.6, 1], [32.8, 1], [33.2, .18]]);
const layers = [1, 2, 4, 6, 8, 9, 9, 8, 6, 3];
const pick = [0, 1, 2, 2, 5, 3, 6, 4, 2, 1];
const pts = [];
layers.forEach((n, i) => {
  const x = 160 + i * 98;
  const lg = g(fan); fade(lg, [[0, 0], [29.6 + i * .2, 0], [29.8 + i * .2, 1]]);
  for (let j = 0; j < n; j++) {
    const y = 520 + (j - (n - 1) / 2) * 22;
    el('circle', { cx: x, cy: y, r: 3.6, fill: C.line }, lg);
    if (i > 0) {
      const m = layers[i - 1], pj = Math.min(m - 1, Math.round(j * (m - 1) / Math.max(1, n - 1)));
      el('line', { x1: x - 98, y1: 520 + (pj - (m - 1) / 2) * 22, x2: x, y2: y, stroke: C.line, 'stroke-width': .8 }, lg);
    }
    if (j === pick[i]) pts.push([x, y]);
  }
});
const path = el('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: C.red, 'stroke-width': 2.2 }, fan);
let plen = 0; for (let i = 1; i < pts.length; i++) plen += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
path.setAttribute('stroke-dasharray', plen.toFixed(1));
on(path, (e, t) => e.setAttribute('stroke-dashoffset', kf(t, [[31.6, plen], [32.6, 0]]).toFixed(1)));
const end = pts[pts.length - 1];
const bad = el('circle', { cx: end[0], cy: end[1], r: 7, fill: C.red }, fan); fade(bad, [[0, 0], [32.5, 0], [32.7, 1]]);
const count = label(fan, 160, 650, '', 13);
on(count, (e, t) => { e.textContent = 'states explored: ' + Math.round(kf(t, [[29.6, 0], [31.6, SPEC.states]])); });
const sbr = label(fan, 1040, 650, 'shortest bad run: ' + SPEC.steps + ' steps', 13, C.red, true, 500, 'end');
fade(sbr, [[0, 0], [32.5, 0], [32.8, 1]]);
const verdict = g(s2); fade(verdict, [[0, 0], [32.8, 0], [33.3, 1]]);
el('rect', { x: 290, y: 410, width: 620, height: 170, rx: 10, fill: C.card, stroke: C.ink, 'stroke-width': 1.3 }, verdict);
const vl = (y, a, b, col, w) => { label(verdict, 320, y, a, 17, C.ink, true, w || 500); label(verdict, 560, y, b, 17, col || C.ink, true, w || 500); };
vl(452, 'NoLoss', 'FAILED  (' + SPEC.steps + '-step story)', C.red);
vl(492, 'NoDuplicateEffect', 'ok, within bounds', C.soft);
vl(546, 'guarantee', 'at-most-once', C.ink, 700);

// ======================= act 3: the trade-off ===========================
const s3 = g(); fade(s3, [[0, 0], [37.6, 0], [38.2, 1], [49.6, 1], [50.0, 0]]);
function column(x, title, a, b, outcome, col, guarantee, tb, tg) {
  label(s3, x, 186, title, 18, C.ink, false, 700);
  box(s3, x, 210, 170, 48); label(s3, x + 85, 240, a, 15, C.ink, false, 500, 'middle');
  box(s3, x + 240, 210, 170, 48); label(s3, x + 325, 240, b, 15, C.ink, false, 500, 'middle');
  arrow(s3, x + 175, 234, x + 235, 234);
  const bl = g(s3); fade(bl, [[0, 0], [tb, 0], [tb + .2, 1]]);
  el('line', { x1: x + 205, y1: 200, x2: x + 205, y2: 272, stroke: C.red, 'stroke-width': 2, 'stroke-dasharray': '5 4' }, bl);
  label(bl, x + 205, 290, 'crash', 13, C.red, true, 500, 'middle');
  const oc = g(s3); fade(oc, [[0, 0], [tb + .7, 0], [tb + 1.0, 1]]);
  label(oc, x, 336, outcome, 17, col, false, 500);
  const gu = g(s3); fade(gu, [[0, 0], [tg, 0], [tg + .4, 1]]);
  label(gu, x, 392, guarantee, 30, C.ink, false, 700);
}
column(90, 'eager=true (the default)', 'store key B', 'call api', 'after the restart B is a duplicate: never sent', C.red, 'at-most-once', 39.4, 43.3);
column(650, 'eager=false', 'call api', 'store key B', 'after the restart B is sent again: called twice', C.amber, 'at-least-once', 41.4, 43.6);
const n1 = label(s3, 90, 470, 'a memory repository forgets its keys on a crash: also at-least-once', 14);
fade(n1, [[0, 0], [44.8, 0], [45.2, 1]]);
const n2 = label(s3, 90, 510, 'effectively-once needs eager=false and an api that ignores a repeated B', 14, C.ink);
fade(n2, [[0, 0], [46.0, 0], [46.4, 1]]);

// ======================= end card ===========================
const s4 = g(); fade(s4, [[0, 0], [50.0, 0], [50.6, 1]]);
label(s4, 600, 300, SPEC.title, 46, C.ink, false, 700, 'middle');
label(s4, 600, 346, SPEC.subtitle, 19, C.soft, false, 500, 'middle');
label(s4, 600, 402, SPEC.url, 15, C.ink, true, 500, 'middle');

// ======================= captions ===========================
const cap = document.getElementById('cap'), act = document.getElementById('act');
on(cap, (e, t) => {
  const cs = SPEC.captions; let i = -1;
  for (let k = 0; k < cs.length; k++) if (t >= cs[k].t) i = k;
  if (i < 0) { e.textContent = ''; return; }
  const c = cs[i], next = cs[i + 1] ? cs[i + 1].t : DUR + 1;
  e.textContent = c.text;
  e.setAttribute('opacity', Math.min(1, (t - c.t) / .35, Math.max(0, (next - t) / .25)).toFixed(3));
});
on(act, (e, t) => { e.textContent = step(t, SPEC.acts.map(a => [a.t, a.label])); });

function render(t) { for (const [e, f] of tracks) f(e, t); }
window.__seek = t => render(Math.max(0, Math.min(DUR, t)));
window.__duration = DUR;
window.__timelines = window.__timelines || {};
window.__timelines['main'] = { duration: () => DUR, seek: t => window.__seek(t), pause: () => {} };

// ---- playback in the browser (hidden when rendering frames) ----
const params = new URLSearchParams(location.search);
if (params.has('render')) { document.documentElement.className = 'render'; render(0); return; }
const btn = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
let t = 0, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches, last = null;
btn.textContent = playing ? 'pause' : 'play';
btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'pause' : 'play'; last = null; };
scrub.oninput = () => { t = scrub.value / 1000 * DUR; render(t); clock.textContent = t.toFixed(1) + ' s'; };
function frame(now) {
  if (playing) { if (last !== null) t = (t + (now - last) / 1000) % DUR; last = now; }
  render(t); scrub.value = Math.round(t / DUR * 1000); clock.textContent = t.toFixed(1) + ' s';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body></html>
